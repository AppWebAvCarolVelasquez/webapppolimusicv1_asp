<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0d0d12">
    <title>PoliMusic - Iniciar Sesion</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body class="login-page">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <main id="main-content" class="login-container" role="main">
        <div class="login-card">
            <h1 class="login-title">PoliMusic</h1>
            <p class="login-subtitle">Inicia sesion para continuar</p>

            <div class="alert alert-error" role="alert" aria-live="assertive">
                <span class="alert-icon" aria-hidden="true">!</span>
                Usuario o contrasena incorrectos.
            </div>

            <form method="post" action="#" class="login-form" novalidate>
                <div class="form-group">
                    <label for="username" class="form-label">
                        Usuario <span class="required" aria-label="campo obligatorio">*</span>
                    </label>
                    <input type="text" id="username" name="username" value="userAdmin" maxlength="50" required
                           autocomplete="username" class="form-input" aria-required="true"
                           aria-invalid="true" aria-describedby="form-error">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        Contrasena <span class="required" aria-label="campo obligatorio">*</span>
                    </label>
                    <input type="password" id="password" name="password" maxlength="100" required
                           autocomplete="current-password" class="form-input" aria-required="true"
                           aria-invalid="true" aria-describedby="form-error">
                </div>

                <p id="form-error" class="sr-only">Usuario o contrasena incorrectos.</p>

                <button type="submit" class="btn btn-primary btn-full">Iniciar Sesion</button>
            </form>

            <p class="login-footer">PoliMusic &copy; Aplicaciones Web Avanzadas</p>
        </div>
    </main>

    <script src="../../assets/js/main.js"></script>
</body>
</html>
